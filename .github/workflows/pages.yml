# Publishes the contents of site/ to GitHub Pages on every push to main.
# Only that directory is uploaded: build/ ships in the repository so the
# pipeline is reproducible, but it is not part of the served site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the deploy: read the tree, write a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the one in flight rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on for the repository the first time this runs,
      # so there is no manual step in Settings before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
